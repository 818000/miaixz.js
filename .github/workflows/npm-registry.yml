name: NPM Registry

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to republish or resume."
        required: true
        type: string
  push:
    tags:
      - "*.*.*"

env:
  NODE_VERSION: "24.21.0"
  NPM_REGISTRY: "https://registry.npmjs.org/"
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  quality:
    name: Validate Tagged Source
    if: ${{ github.repository == '818000/miaixz.js' }}
    uses: ./.github/workflows/build-project.yml
    with:
      target-ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      artifact-key: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

  publish:
    name: Publish Validated Tarballs
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: release
      url: https://www.npmjs.com/search?q=%40miaixz
    outputs:
      version: ${{ steps.release.outputs.version }}
      is-prerelease: ${{ steps.release.outputs.is-prerelease }}
    steps:
      - name: Check Out Existing Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Set Up Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY }}
          package-manager-cache: false

      - name: Verify Existing Tag and Metadata
        id: release
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/${TAG}" || {
            echo "::error::Tag '${TAG}' does not exist"
            exit 1
          }
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out HEAD does not equal the peeled tag commit"
            exit 1
          fi
          node .github/scripts/release/check-release-metadata.mjs "$TAG"
          if [[ "$TAG" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "is-prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          npm run check:clean

      - name: Download Validated Tarballs
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: packages-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/packages

      - name: Publish Both Packages to npm
        uses: ./.github/actions/npm-registry
        with:
          version: ${{ steps.release.outputs.version }}
          registry: ${{ env.NPM_REGISTRY }}
          sdk-tarball: ${{ runner.temp }}/packages/miaixz-sdk-${{ steps.release.outputs.version }}.tgz
          ui-tarball: ${{ runner.temp }}/packages/miaixz-ui-${{ steps.release.outputs.version }}.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    name: Create Release After npm Publication
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/create-release.yml
    with:
      tag: ${{ needs.publish.outputs.version }}
      version: ${{ needs.publish.outputs.version }}
      prerelease: ${{ needs.publish.outputs.is-prerelease == 'true' }}
