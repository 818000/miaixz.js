name: Create Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing Git tag to release."
        required: true
        type: string
      version:
        description: "Exact release version."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release."
        required: true
        type: string
      version:
        description: "Exact release version; must equal the tag."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Existing Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Verify Existing Tag and Metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$RELEASE_VERSION" ]; then
            echo "::error::Release tag and version must be identical"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || {
            echo "::error::Tag '${RELEASE_TAG}' does not exist"
            exit 1
          }
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out HEAD does not equal the peeled tag commit"
            exit 1
          fi
          node .github/scripts/release/check-release-metadata.mjs "$RELEASE_VERSION"
          npm run check:clean

      - name: Confirm Both npm Packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for package_name in @miaixz/sdk @miaixz/ui; do
            published="$(npm view "${package_name}@${RELEASE_VERSION}" version --json --prefer-online | tr -d '"[:space:]')"
            if [ "$published" != "$RELEASE_VERSION" ]; then
              echo "::error::${package_name}@${RELEASE_VERSION} is not visible on npm"
              exit 1
            fi
          done

      - name: Resolve Release Notes
        id: notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          body_path="$RUNNER_TEMP/release-notes-${RELEASE_VERSION}.md"
          node .github/scripts/release/create-release-notes.mjs "$RELEASE_VERSION" "$body_path"
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: ./.github/actions/create-release
        with:
          tag: ${{ inputs.tag }}
          version: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body_path: ${{ steps.notes.outputs.body_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
