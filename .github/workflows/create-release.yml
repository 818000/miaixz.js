name: Create Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing Git tag to release."
        required: true
        type: string
      version:
        description: "Exact release version."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to release."
        required: true
        type: string
      version:
        description: "Exact release version; must equal the tag."
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub Release as a pre-release."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate-comments:
    name: Validate Release Comments
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Existing Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Install Dependencies
        run: npm install --ignore-scripts --no-package-lock --legacy-peer-deps

      - name: Validate Comments
        run: npm run comments:check

  create-release:
    name: Create GitHub Release
    needs: validate-comments
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Existing Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Set Up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Verify Existing Tag and Metadata
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" != "$RELEASE_VERSION" ]; then
            echo "::error::Release tag and version must be identical"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}" || {
            echo "::error::Tag '${RELEASE_TAG}' does not exist"
            exit 1
          }
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out HEAD does not equal the peeled tag commit"
            exit 1
          fi
          node .github/scripts/release/check-release-metadata.mjs "$RELEASE_VERSION"
          npm run check:clean

      - name: Confirm All npm Packages
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/release/check-published-packages.mjs "$RELEASE_VERSION"

      - name: Create Release
        uses: ./.github/actions/create-release
        with:
          tag: ${{ inputs.tag }}
          version: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
