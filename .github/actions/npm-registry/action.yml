name: Publish to npm
description: "Publishes every public workspace at one shared version"

inputs:
  version:
    description: "Exact version shared by all packages."
    required: true
  registry:
    description: "npm registry URL."
    required: false
    default: "https://registry.npmjs.org/"
  package-directory:
    description: "Directory containing validated tarballs and workspace-packages.json."
    required: true

runs:
  using: composite
  steps:
    - name: Publish All Packages
      shell: bash
      env:
        RELEASE_VERSION: ${{ inputs.version }}
        NPM_REGISTRY: ${{ inputs.registry }}
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
      run: >-
        node .github/scripts/release/publish-packages.mjs
        "$RELEASE_VERSION"
        "$PACKAGE_DIRECTORY"
        "$NPM_REGISTRY"
